<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>郑在旅途的书库</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <!-- JSZip (epub.js depends on it, must load first) -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <!-- epub.js -->
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
  <!-- PDF.js -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- 书架视图 -->
    <div id="library-view" class="view active">
      <header class="header">
        <div class="header-left">
          <div class="logo">
            <span class="logo-icon">📚</span>
            <h1>郑在旅途的书库</h1>
          </div>
          <span class="book-count" id="book-count">0 本书</span>
        </div>
        <div class="header-actions">
          <div class="search-box">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input type="text" id="search-input" placeholder="搜索书名...">
          </div>
          <button id="settings-btn" class="btn btn-icon" title="设置">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
          <button id="upload-btn" class="btn btn-icon" title="上传书籍">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
          </button>
          <input type="file" id="file-input" multiple accept=".epub,.pdf,.mobi,.azw,.azw3,.txt,.fb2,.djvu,.cbz,.cbr,.doc,.docx,.rtf,.html,.htm,.md" style="display:none">
        </div>
      </header>
      
      <!-- 分类筛选 -->
      <div class="filter-bar">
        <div class="folder-nav">
          <button class="folder-btn active" data-folder="all" onclick="switchFolder('all')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>全部</span>
            <span class="count" id="count-all">0</span>
          </button>
          <div class="folder-list" id="folder-list">
            <!-- 动态生成 -->
          </div>
        </div>
        <div class="format-filter">
          <button class="filter-btn active" data-format="all">全部格式</button>
          <button class="filter-btn" data-format="epub">EPUB</button>
          <button class="filter-btn" data-format="pdf">PDF</button>
          <button class="filter-btn" data-format="txt">TXT</button>
          <button class="filter-btn" data-format="mobi">MOBI</button>
          <button class="filter-btn" data-format="cbz">漫画</button>
        </div>
      </div>
      
      <div id="books-grid" class="books-grid">
        <div class="loading">
          <div class="spinner"></div>
          <p>加载中...</p>
        </div>
      </div>
    </div>
    
    <!-- 阅读视图 -->
    <div id="reader-view" class="view">
      <header class="reader-header">
        <button id="back-btn" class="btn-back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>返回</span>
        </button>
        <span id="book-title" class="book-title"></span>
        <div class="reader-controls">
          <button id="font-decrease" class="btn-control" title="减小字体">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 7V4h16v3M9 20h6M12 4v16"></path>
            </svg>
          </button>
          <button id="font-increase" class="btn-control" title="增大字体">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 7V4h16v3M9 20h6M12 4v16M20 12h-6"></path>
            </svg>
          </button>
          <button id="theme-toggle" class="btn-control" title="切换主题">
            <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </header>
      <div id="reader-container" class="reader-container">
        <div id="epub-viewer" style="display:none;"></div>
      </div>
      <div id="epub-navbar" class="epub-navbar" style="display:none;"></div>
    </div>
    
    <!-- 设置弹窗 -->
    <div id="settings-modal" class="modal">
      <div class="modal-content settings-content">
        <div class="modal-header">
          <h3>⚙️ 设置</h3>
          <button class="btn-close" onclick="closeSettings()">×</button>
        </div>
        <div class="settings-section">
          <label>网站图标 (Favicon)</label>
          <div class="input-group">
            <input type="text" id="favicon-input" placeholder="输入图标 URL 或留空使用默认">
            <button class="btn btn-small" onclick="applyFavicon()">应用</button>
          </div>
        </div>
        <div class="settings-section">
          <label>背景图片</label>
          <div class="input-group">
            <input type="text" id="background-input" placeholder="输入背景图 URL">
            <button class="btn btn-small" onclick="applyBackground()">应用</button>
          </div>
        </div>
        <div class="settings-section">
          <label>背景透明度</label>
          <div class="input-group">
            <input type="range" id="background-opacity" min="0" max="100" value="100">
            <span id="opacity-value">100%</span>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 上传进度 -->
    <div id="upload-modal" class="modal">
      <div class="modal-content">
        <div class="modal-icon">📤</div>
        <h3>上传中...</h3>
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
        <p id="upload-status">准备上传...</p>
      </div>
    </div>
  </div>
  
  <script src="/js/app.js"></script>
  <script src="/js/reader.js"></script>
</body>
</html>
