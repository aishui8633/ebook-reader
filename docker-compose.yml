version: '3.8'

services:
  ebook-reader:
    build: .
    container_name: ebook-reader
    restart: unless-stopped
    ports:
      - "8374:8374"
    environment:
      - PORT=8374
      - BOOKS_DIR=/books
    volumes:
      # 挂载 NAS 上的书库目录
      - /vol2/1000/books/书库:/books
    networks:
      - default

networks:
  default:
